[package]
name = "todo-app"
version = "0.1.0"
edition = "2021"

[lib]
name = "todo_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
todo-core = { path = "../core" }
todo-service = { path = "../service" }
