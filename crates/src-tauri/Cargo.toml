[package]
name = "keel"
version = "0.1.0"
edition = "2021"

[lib]
name = "keel_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keel-core = { path = "../core" }
keel-service = { path = "../service" }
tauri-plugin-notification = "2"
tauri-plugin-glass = { path = "../plugin-glass" }
chrono = "0.4"
time = "0.3"

[features]
# TypeScript bindings for the IPC types (web/src/bindings); off by default.
ts = ["keel-core/ts", "keel-service/ts"]
