[package]
name = "keel-core"
version = "0.1.0"
edition = "2021"

[lib]
name = "keel_core"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ulid = "1"
chrono = { version = "0.4", features = ["serde"] }
ts-rs = { version = "=11.1.0", optional = true, features = ["chrono-impl", "serde-json-impl"] }

[features]
# TypeScript bindings for the IPC types (web/src/bindings); off by default.
ts = ["dep:ts-rs"]
