[package]
name = "keel-ui"
version = "0.1.0"
edition = "2021"

[dependencies]
dioxus = { version = "0.6", features = ["web"] }
keel-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
serde-wasm-bindgen = "0.6"
js-sys = "0.3"
chrono = "0.4"
base64 = "0.22"
# ulid (via keel-core) pulls getrandom; on wasm it needs the wasm_js backend.
getrandom = { version = "0.3", features = ["wasm_js"] }
