[package]
name = "keel-service"
version = "0.1.0"
edition = "2021"

[lib]
name = "keel_service"
path = "src/lib.rs"

[dependencies]
keel-core = { path = "../core" }
keel-storage = { path = "../storage" }
chrono = "0.4"
serde_json = "1"

[features]
# TypeScript bindings for the IPC types; the types themselves live in keel-core.
ts = ["keel-core/ts"]

[dev-dependencies]
tempfile = "3"
