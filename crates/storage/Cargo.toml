[package]
name = "keel-storage"
version = "0.1.0"
edition = "2021"

[lib]
name = "keel_storage"
path = "src/lib.rs"

[dependencies]
keel-core = { path = "../core" }
rusqlite = { version = "0.32", features = ["bundled"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
tempfile = "3"
