name: CI

# Checks that Keel builds for Windows (desktop) and iOS with the React UI in
# web/, and that web/ passes its gates. Nothing is signed or deployed. Plan: docs/superpowers/plans/2026-10-20-ci.md
on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Match the Mac.
  TAURI_CLI_VERSION: 2.12.3

jobs:
  windows:
    name: Windows (tests, desktop app)
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: . -> target
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2
        with:
          tool: tauri-cli@${{ env.TAURI_CLI_VERSION }}

      # First: tauri::generate_context! needs web/dist to exist.
      - uses: ./.github/actions/web-setup
      - name: Build the web UI
        working-directory: web
        run: pnpm build

      - name: Tests (core, storage, service, app)
        run: cargo test

      - name: Build the desktop app
        working-directory: crates/src-tauri
        run: cargo tauri build --no-bundle

  ios:
    name: iOS (Rust + Swift, unsigned)
    runs-on: macos-26
    env:
      # Cargo-only builds compile the glass plugin's Swift without Xcode's
      # settings; without this they target an old iOS and every iOS 26 API
      # (glassEffect, …) is "unavailable". Matches minimumSystemVersion.
      IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: wasm32-unknown-unknown, aarch64-apple-ios, aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: . -> target
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2
        with:
          tool: tauri-cli@${{ env.TAURI_CLI_VERSION }}

      - uses: ./.github/actions/web-setup
      - name: Build the web UI
        working-directory: web
        run: pnpm build

      # The device target: with the simulator target, the runner's Xcode
      # archives for a device anyway and the Rust build step gets no ARCHS.
      - name: Build the iOS app (iPhone, unsigned)
        working-directory: crates/src-tauri
        run: cargo tauri ios build --target aarch64 --debug --no-sign --ci

      - name: Build for the simulator (Rust only)
        run: cargo build --lib -p keel --target aarch64-apple-ios-sim

  web:
    name: Web (types, lint, tests, bindings, supply chain)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Tauri's Linux build deps: scripts/check-bindings.sh compiles the keel
      # crate (cargo test -p keel), which links webkit2gtk and GTK.
      - name: Install Tauri's Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: . -> target
      - uses: ./.github/actions/web-setup

      # build:wasm, tsc -b, biome ci, vitest, check:deps
      - name: Check (types, lint, tests, dependency rules)
        working-directory: web
        run: pnpm check
      - name: Build
        working-directory: web
        run: pnpm build

      # Build made web/dist, which tauri::generate_context! needs.
      - name: Bindings are up to date
        run: scripts/check-bindings.sh

      - name: Audit npm dependencies
        working-directory: web
        run: pnpm audit --audit-level moderate
      # The scanner is a Docker action; it exits non-zero when it finds a
      # vulnerability in the lockfile.
      - name: OSV-Scanner
        uses: google/osv-scanner-action/osv-scanner-action@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
        with:
          scan-args: --lockfile=web/pnpm-lock.yaml
