name: Web supply chain

# Weekly check of web/ against newly published advisories, even when nobody
# has pushed: installs from the lockfile on main, then audits it.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Audit npm dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - name: Install web dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile
      - name: Audit npm dependencies
        working-directory: web
        run: pnpm audit --audit-level moderate
      - name: OSV-Scanner
        uses: google/osv-scanner-action/osv-scanner-action@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
        with:
          scan-args: --lockfile=web/pnpm-lock.yaml
